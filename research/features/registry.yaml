- name: btc_regime
  version: 1
  formula: dernier rendement BTC CONNU à t (as-of strict, searchsorted)
  availability: {signal_time: t (join as-of)}
  causal: true
  asof: true
  impl: scripts/full_arsenal_2.py (contagion, fix C7)
  tests: [test_lot4_funding_causality.py]

