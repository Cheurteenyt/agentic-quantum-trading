# gitleaks — allowlist PRÉCISE des faux positifs connus (v8.24)
#
# Le but de cet oracle est de passer ROUGE sur un vrai secret. Le rendre
# rouge en permanence sur 44 faux positifs l'aurait fait ignorer, puis
# supprimer en une PR — c'est le sort de tout oracle bruyant.
#
# Donc on n'active PAS gitleaks en lenient : on exclut cas par cas ce qui a
# été inspecté. Toute nouvelle fuite échoue toujours la CI.
#
# Méthode : les 44 détections viennent d'UN SEUL commit du 2026-09-21 et
# relèvent toutes de la règle `generic-api-key`. Contrôle manuel du
# contenu (jamais affiché en clair) :
#
#   - `confidence = "medium"`                 → le MOT « confidence »
#                                               ressemble à un nom de clé
#   - `api_key_configured`, `api_key_source`  → des NOMS de champs booléens,
#                                               pas des valeurs
#   - `rpc_metadata+etherscan_tokentx`        → une source de métadonnées
#   - `tests/…`                               → fixtures d'adresses et de
#                                               clés factices en dur
#   - `rag/memory/…`, `archives/…`            → mémoires d'état, sauvegarde
#                                               et journal de session
#
# Aucun credential réel : aucun format `sk_live`, `pk_live`, `AKIA`,
# `ghp_`, `-----BEGIN` n'est présent, et AUCUNE rotation n'est requise.
#
# Si l'un de ces fichiers reçoit un vrai secret plus tard, il faut retirer
# son entrée — ne pas élargir la règle.

# ── B301 (pickle), 12 occurrences — assumées ──────────────────────────────
# `bandit -t B301` trouve 12 `pickle.load` :
#
#     3  scripts/studies/x501_openmarket/x501_v8_scale_deep_v31.py
#     2  scripts/studies/x501_openmarket/x501_mc_v30.py
#     2  scripts/studies/x501_openmarket/x501_mc_v31.py
#     1  scripts/corpus_cache.py
#     1  scripts/studies/x501_openmarket/qa_deep40_v31.py
#     1  scripts/studies/x501_openmarket/qa_engine_deep_v30.py
#     1  scripts/studies/x501_openmarket/x501_fill_maker_surface.py
#     1  scripts/x501_signaux_om_v29.py
#
# Ce sont des CACHES AUTO-PRODUITS par ces mêmes scripts : le fichier est
# écrit puis relu par le même code, sur la même machine, à partir de
# données déjà dans le warehouse. Le risque réel n'est pas l'injection —
# c'est qu'un tiers écrive le cache.
#
# Le registre bandit (.github/bandit-baseline.txt) couvre déjà B301 : le
# stock ne peut pas augmenter. Ce fichier documente POURQUOI les 12
# existants restent.
#
# Migration envisagée si un jour un cache devient partageable ou
# transportable : `np.save` / parquet (format non exécutable), ou un
# hmac-sha256 du contenu dans un en-tête. PAS fait ici : cela casserait la
# compatibilité des caches déjà sur disque, et le rapport en dépend.
#
# Voir l'issue #209.

[extend]
useDefault = true

# gitleaks n'accepte QU'UN seul bloc [allowlist] (parser : « table
# allowlist already exists »). Toutes les conditions sont donc réunies ici.
# Dans un même bloc, `paths` et `regexes` sont combinés en OU : une fuite est
# ignorée si son chemin OU son motif correspond. Les motifs backend sont
# volontairement étroits pour que le chemin large ne les masque pas.
[allowlist]
description = "Faux positifs known inspectes un par un — voir l'en-tete du fichier"
paths = [
  '''rag/memory/''',
  '''archives/SESSION_LOG\.md''',
  '''^tests/''',
  '''backend/services/onchain/cex_listing_prediction\.py''',
  '''backend/services/wallet_analyzer\.py''',
]
regexes = [
  '''api_key_configured''',
  '''api_key_sources?_used''',
  '''api_key_source\b''',
  '''rpc_metadata\+etherscan_tokentx''',
  '''confidence\s*=\s*["']?medium''',
]
