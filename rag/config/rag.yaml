project:
  name: core-equity
  root: D:/trading-agent
  collection: trading_agent_code_v1
  default_domain: full

domains:
  full:
    description: Whole repository RAG for broad questions.
    collection: trading_agent_code_v1
    bm25_path: D:/trading-agent/rag/cache/bm25_chunks.jsonl
    include:
      - AGENTS.md
      - rag/README.md
      - rag/config/**/*.yaml
      - rag/scripts/**/*.py
      - rag/memory/**/*.md
      - docs/**/*.md
      - backend/*.py
      - backend/routers/**/*.py
      - backend/services/**/*.py
      - backend/models/**/*.py
      - backend/schemas/**/*.py
      - frontend/src/*.ts
      - frontend/src/*.tsx
      - frontend/src/pages/**/*.tsx
      - frontend/src/components/**/*.tsx
      - frontend/src/components/**/*.ts
      - frontend/src/services/**/*.ts
      - frontend/src/hooks/**/*.ts
      - frontend/src/contexts/**/*.tsx
  backend:
    description: FastAPI routers, services and schemas.
    collection: core_code_backend
    bm25_path: D:/trading-agent/rag/cache/bm25_backend.jsonl
    include:
      - AGENTS.md
      - backend/*.py
      - backend/routers/**/*.py
      - backend/services/**/*.py
      - backend/models/**/*.py
      - backend/schemas/**/*.py
      - rag/memory/**/*.md
  frontend:
    description: React pages, components, client services and hooks.
    collection: core_code_frontend
    bm25_path: D:/trading-agent/rag/cache/bm25_frontend.jsonl
    include:
      - AGENTS.md
      - frontend/src/*.ts
      - frontend/src/*.tsx
      - frontend/src/pages/**/*.tsx
      - frontend/src/components/**/*.tsx
      - frontend/src/components/**/*.ts
      - frontend/src/services/**/*.ts
      - frontend/src/hooks/**/*.ts
      - frontend/src/contexts/**/*.tsx
      - rag/memory/**/*.md
  data:
    description: Arkham-like labels, RPC, on-chain data, Scrapling and Alpha data logic.
    collection: core_data_architecture
    bm25_path: D:/trading-agent/rag/cache/bm25_data.jsonl
    include:
      - AGENTS.md
      - backend/routers/arkham.py
      - backend/routers/onchain.py
      - backend/routers/alpha_lab.py
      - backend/services/*arkham*.py
      - backend/services/*onchain*.py
      - backend/services/*label*.py
      - backend/services/*scrapling*.py
      - backend/services/seed_ingestion.py
      - backend/services/alpha*.py
      - backend/services/wallet*.py
      - rag/memory/**/*.md
  aster:
    description: Aster research, paper trading, strategy discovery, validators, RL lane policy and Aster documentation.
    collection: core_aster_research
    bm25_path: D:/trading-agent/rag/cache/bm25_aster.jsonl
    include:
      - AGENTS.md
      - backend/routers/onchain.py
      - backend/services/onchain/aster/**/*.py
      - backend/services/onchain/aster/**/*.md
      - docs/aster*.md
      - docs/core-equity-aster*.html
      - docs/core-equity-null-results-report.html
      - rag/memory/project_state.md
      - rag/memory/aster_python_structure_rules.md
  memory:
    description: Durable project state, operating playbooks and advisor protocol.
    collection: core_memory_decisions
    bm25_path: D:/trading-agent/rag/cache/bm25_memory.jsonl
    include:
      - AGENTS.md
      - rag/README.md
      - rag/config/**/*.yaml
      - rag/memory/**/*.md
      - rag/scripts/local_advisor.py
      - rag/scripts/rag_tool.py
  security:
    description: Client access, wallet safety, auth gates and security operating context.
    collection: core_security_context
    bm25_path: D:/trading-agent/rag/cache/bm25_security.jsonl
    include:
      - AGENTS.md
      - docs/security/**/*.md
      - docs/*access*.md
      - backend/main.py
      - backend/routers/alpha_lab.py
      - frontend/src/services/walletSafety.ts
      - frontend/src/pages/Dashboard.tsx
      - rag/memory/**/*.md

llama_cpp:
  backend: ik_llama.cpp
  server_exe: D:/llama-server/llama-b8407-bin-win-cuda-12.4-x64/llama-server.exe
  ik_server_exe: D:/ik_llama.cpp/build/bin/llama-server.exe
  model_path: D:/llama-server/models/qwen3.5/Qwen3.5-9B-Claude-4.6-HighIQ-INSTRUCT-HERETIC-UNCENSORED.Q4_K_M.gguf
  api_base: http://127.0.0.1:8080/v1
  chat_model: qwen3.5-9b
  temperature: 0.15
  max_tokens: 4096
  timeout_seconds: 180
  host: 127.0.0.1
  port: 8080
  ctx_size: 12288
  gpu_layers: 30
  threads: 8
  parallel: 1
  flash_attention: true

embeddings:
  provider: huggingface
  model: BAAI/bge-small-en-v1.5
  device: auto
  batch_size: 32
  dimensions: 384

chunking:
  chunk_size: 512
  chunk_overlap: 80

retrieval:
  similarity_top_k: 8
  bm25_top_k: 12
  fusion_top_k: 12
  response_top_k: 4
  vector_weight: 0.58
  bm25_weight: 0.42

storage:
  qdrant_mode: server
  qdrant_url: http://127.0.0.1:6333
  qdrant_path: D:/trading-agent/rag/indexes/qdrant
  qdrant_server_path: D:/trading-agent/rag/indexes/qdrant_server
  llamaindex_path: D:/trading-agent/rag/indexes/llamaindex_storage
  bm25_path: D:/trading-agent/rag/cache/bm25_chunks.jsonl

include:
  - AGENTS.md
  - rag/README.md
  - rag/config/**/*.yaml
  - rag/scripts/**/*.py
  - rag/memory/**/*.md
  - docs/**/*.md
  - backend/*.py
  - backend/routers/**/*.py
  - backend/services/**/*.py
  - backend/models/**/*.py
  - backend/schemas/**/*.py
  - frontend/src/*.ts
  - frontend/src/*.tsx
  - frontend/src/pages/**/*.tsx
  - frontend/src/components/**/*.tsx
  - frontend/src/components/**/*.ts
  - frontend/src/services/**/*.ts
  - frontend/src/hooks/**/*.ts
  - frontend/src/contexts/**/*.tsx

exclude_dirs:
  - .git
  - .venv
  - .venv-win
  - .venv-rag
  - .venv.wsl
  - node_modules
  - dist
  - build
  - logs
  - tmp
  - rag/indexes
  - rag/cache
  - backend/static
  - .pytest_cache
  - .mypy_cache
  - .ruff_cache
  - __pycache__

exclude_globs:
  - "rag/memory/generated_project_map.md"
  - "**/.env"
  - "**/.env.*"
  - "**/*.db"
  - "**/*.sqlite"
  - "**/*.sqlite3"
  - "**/*.pyc"
  - "**/*.pyo"
  - "**/*.tar"
  - "**/*.tar.gz"
  - "**/*.zip"
  - "**/*.7z"
  - "**/*.jsonl"
  - "**/*dump*"
  - "**/backups/**/*"
  - "**/secrets/**/*"
  - "**/*.pfx"
  - "**/*.png"
  - "**/*.jpg"
  - "**/*.jpeg"
  - "**/*.webp"
  - "**/*.gif"
  - "**/*.pem"
  - "**/*.key"
  - "**/*.cert"
  - "**/*.crt"
  - "**/*credentials*.json"
  - "**/_test_*.py"
  - "**/test_*.py"
  - "**/_fix*.py"
  - "**/fix_*.py"
  - "**/patch_*.py"
  - "**/*.log"
