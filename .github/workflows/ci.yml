name: CI
on: [push, pull_request, merge_group]
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.lock --quiet
      - name: Run tests
        run: python scripts/run_tests.py --fast
      - name: Research integrity (invariants I001-I008)
        run: python scripts/research_integrity.py
      - name: Audit check (bloquant sur --fail-on)
        run: python scripts/audit_check.py --fail-on A1,A2,A4,B2,B3,B4,C1,C2,C3,C4,C5,E1,E2,F1,F2,F3,F4,F5
