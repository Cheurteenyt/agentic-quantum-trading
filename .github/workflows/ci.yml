name: CI
on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    # Palier T3 (nuit) — le « lent » et la calibration pleine tournent ici.
    - cron: "30 2 * * *"
permissions:
  contents: read

# Concurrency : un push qui écrase le précédent annule le run de l'ANCIEN
# commit (dernier état fait foi, pas de runs fantômes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
# PALIERS (revue d'architecture 2026-10-10, E1). Un seul workflow, découpé en
# paliers par ÉVÉNEMENT et par CHEMINS MODIFIÉS, pour qu'un test de noyau et
# un audit de dépendances n'aient plus le même statut, et qu'une PR docs-only
# ne relance pas la suite Python.
#
#   T1  PR / push de branche   ≤ 10 min  noyau + oracles + rochets + CVE (filtré par chemins)
#   T2  merge_group / dispatch ≤ 25 min  suite COMPLÈTE (SLOW_FILES) + frontend complet
#   T3  nuit (schedule)        libre     suite complète, gitleaks historique, calibration
#
# ⚠️ E2 (audit 10/10) — CE QUE T2 N'EST PAS. T2 est conditionné à
# `merge_group || workflow_dispatch`. Or la merge queue n'est PAS activée sur
# ce dépôt (0 run `merge_group` dans tout l'historique, vérifié via l'API
# Actions) : T2 ne se déclenche donc jamais en pratique. Tout ce qui n'existe
# QUE dans T2 n'est jamais exécuté. C'est ce qui a laissé `main` rouge sur
# audit_check C4 (STATE.md 3701 o > 3000 o) avec tous les runs au vert.
# Règle : un oracle ou un rochet BLOQUANT va en T1. T2 ne garde que le LENT
# (suite complète), et le LENT est couvert la nuit par T3.
#
# Le job `gate` agrège les paliers pertinents selon l'événement et reste le
# SEUL required status check. Il est TOUJOURS défini (jamais `skipped`) —
# cf. le piège #259 : un required check skipped bloque la PR pour toujours.
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  # Détection des chemins modifiés : conditionne T1 (une PR docs-only ne
  # relance pas la suite Python). `dorny/paths-filter` épinglé par SHA.
  changes:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      core: ${{ steps.filter.outputs.core }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docs: ${{ steps.filter.outputs.docs }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            # ⚠️ `core` DOIT couvrir tout ce que le gate ANALYSE lui-même.
            # Sinon une PR touchant un fichier surveillé est classée core=false,
            # t1-core/t1-security sautent, et l'erreur passe — alors que le gate
            # AURAIT su la voir. Défaut trouvé le 10/10 : `discord_bot/**` (22
            # .py) et `agent/**` (4 .py) sont dans le scope pyflakes/bandit
            # (lignes du job t1-core/t1-security) mais étaient ABSENTS d'ici —
            # une PR discord_bot-only ne déclenchait AUCUN palier. Prouvé : un
            # `undefined name` injecté dans discord_bot/bot.py fait bien rougir
            # le pyflakes du gate.
            # Le test tests/test_ci_filtre_core.py verrouille l'équivalence
            # entre cette liste et le scope déclaré dans les steps du workflow.
            #
            # `core` couvre aussi les fichiers que les ORACLES LISENT (pas
            # seulement ceux qu'ils exécutent). `claim_verify.py` vérifie
            # chaque fait du ledger `research/evidence/facts.jsonl` contre son
            # fichier de preuve — qui peut vivre n'importe où. Deux d'entre eux
            # étaient hors `core` : modifier `docs/21-vagues-registre.md` (faits
            # F-033/F-034/F-035) ou `reports/al-gradient-reproof-2026-10-07.md`
            # (F-037) rendait le fait CONTREDIT (mesuré : 41/42) sans qu'aucun
            # palier ne tourne. Les preuves du ledger sont donc énumérées
            # ci-dessous ; le test les DÉRIVE du ledger, donc ajouter un fait
            # pointant un nouveau fichier force la mise à jour de cette liste.
            core:
              - 'scripts/**'
              - 'research/**'
              - 'tests/**'
              - 'backend/**'
              - 'discord_bot/**'
              - 'agent/**'
              - 'pyproject.toml'
              - 'requirements*.txt'
              - 'requirements.lock'
              # Preuves du ledger hors des dossiers ci-dessus (cf. test) :
              - 'docs/21-vagues-registre.md'
              - 'reports/al-gradient-reproof-2026-10-07.md'
              # Entrées lues par `audit_check.py` (contrôles BLOQUANTS
              # A1/A2/A4/C1/C2/E1/E2) — même raison : ce sont des fichiers
              # que l'oracle LIT, donc les modifier peut le faire rougir.
              # `.zcode/**` = les prompts d'agent (injectAgentsMd, cible
              # 60-70, appel de lab_ledger) ; `docs/lab/**` = mortuary +
              # hypothèses pré-enregistrées ; le `.service` = la carte des
              # scripts de la campagne nocturne ; `docs/25` = le MC courant.
              # Mesuré : retirer `lab_ledger.py` de quant-researcher.md fait
              # rougir A4 ; retirer une famille du mortuary fait rougir C1.
              - '.zcode/**'
              - 'docs/lab/**'
              - 'docs/25-openmarket-x501.md'
              - 'configs/systemd-user/trading-agent-nightly.service'
            frontend:
              - 'frontend/**'
            docs:
              - 'docs/**'
              - '**.md'
              - 'LICENSE'
            ci:
              # `.github/**` couvre le workflow ET ses fichiers de référence
              # (baselines de rochets, .gitleaks.toml, CODEOWNERS…) : une PR qui
              # les modifie doit passer par les paliers qu'ils gouvernent.
              - '.github/**'
              # Les gardes hors `.github/` que les steps du workflow lisent ou
              # exécutent directement, et qui n'appartiennent à aucun autre
              # filtre : lancer le workflow sans les avoir relus serait un trou.
              - '.gitleaks.toml'
              - 'start_all.sh'

  # ═══ PALIER T1 — PR rapide (≤ 6 min), filtré par chemins ═══
  # Ne tourne QUE si du code noyau change (pas pour une PR docs-only) — SAUF
  # en merge_group, où l'on juge l'état fusionné réel et le filtre chemins
  # serait trompeur (les fichiers modifiés sont ceux de toute la file).
  # Les oracles déterministes du noyau sont quasi instantanés (0.05–8 s) ;
  # le coût est la suite --fast.
  t1-core:
    # E2-ter : `ci` (`.github/**`) doit AUSSI déclencher ce palier. Sans ça, une
    # PR qui ne touche QUE le workflow était classée core=false → t1-core
    # SKIPPED → la modification du pipeline n'était jamais validée par le
    # pipeline lui-même. C'est un fail-open de la porte sur elle-même : mesuré
    # sur la PR #277 (t1-core `skipping` alors que le diff modifiait ci.yml).
    if: >-
      github.event_name != 'schedule' &&
      (github.event_name == 'merge_group' ||
       needs.changes.outputs.core == 'true' ||
       needs.changes.outputs.ci == 'true')
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install --no-deps -r requirements.lock --quiet
      - name: Oracle pyflakes (noms indéfinis — BLOQUANT)
        run: |
          pip install pyflakes --quiet
          if python -m pyflakes scripts backend discord_bot agent tests | grep "undefined name '"; then
            echo "::error::undefined name détecté — corrige ou importe"
            exit 1
          fi
      # pytest exécute nativement les unittest.TestCase (parité prouvée E0 :
      # 2851 tests). -n auto parallélise. --fast garde la sélection actuelle
      # (run_tests.py) le temps de la migration vers les marqueurs.
      - name: Suite noyau (--fast, parallèle)
        run: |
          pip install pytest==9.1.1 pytest-xdist==3.8.0 --quiet
          python scripts/run_tests.py --fast
      - name: Oracles du noyau (provenance, puissance, G10, intégrité)
        run: |
          python scripts/research_integrity.py
          python scripts/ledger_provenance.py
          python scripts/ledger_puissance.py
          python scripts/audit_path_root.py
      # E2-bis (10/10) : claim_verify.py était le SEUL oracle du gate à ne
      # jamais tourner en CI — il ne s'exécutait qu'à la main, sur un poste où
      # `reports/` existe. Or il lit `research/evidence/facts.jsonl` (42 faits
      # F-XXX) et revérifie chaque fait contre le CONTENU des fichiers cités.
      # Vérifié dans un clone propre (sans .venv, sans reports/ local) : 42/42
      # SUPPORTED, exit 0 — le seul chemin `reports/` du ledger (F-037) est
      # TRACKÉ dans git, donc présent au checkout. Stdlib + git uniquement.
      - name: Vérificateur de preuves (F-XXX — BLOQUANT)
        run: python scripts/claim_verify.py --all
      # E2 (audit 10/10) : ces trois étapes vivaient en T2, lui-même conditionné
      # à merge_group|workflow_dispatch. Or la merge queue n'est PAS activée sur
      # ce dépôt (0 run merge_group dans tout l'historique) : audit_check et le
      # rochet deep-audit ne tournaient donc JAMAIS. C'est exactement ce qui a
      # laissé passer C4 (STATE.md à 3701 o > 3000 o) sur main sans qu'aucun run
      # ne rougisse. Ils coûtent quelques secondes — leur place est ici, avec les
      # autres oracles déterministes du noyau, pas dans un palier qui n'existe pas.
      - name: Audit check (bloquant sur --fail-on)
        run: python scripts/audit_check.py --fail-on A1,A2,A4,B2,B3,B4,C1,C2,C3,C4,C5,E1,E2,F1,F2,F3,F4,F5
      - name: Rochet deep-audit (BLOQUANT)
        run: python scripts/deep_audit.py --check
      - name: Rochet dette_PR <= dette_main (deep-audit)
        run: |
          # Garde fail-CLOSED : sans elle, un `origin/main` non résolvable
          # (checkout sans fetch-depth: 0, branche par défaut renommée…)
          # faisait tomber le `git show` dans le `else`, qui n'émettait qu'un
          # `::notice::` — donc le rochet de dette mourait EN SILENCE, et une
          # PR pouvait relever son propre baseline sans être rattrapée.
          # On distingue les deux causes : REF absente = infra cassée -> ROUGE ;
          # ref OK mais CHEMIN absent sur main = introduction d'un baseline
          # (cas historique, cf. #254) -> notice, la comparaison n'a pas d'objet.
          if ! git rev-parse --verify --quiet origin/main >/dev/null; then
            echo "::error::origin/main introuvable — le rochet dette_PR <= dette_main ne peut pas comparer (checkout avec fetch-depth: 0 ?)"
            exit 1
          fi
          if git show origin/main:.github/deep-audit-baseline.json > /tmp/main_deep_audit.json 2>/dev/null; then
            python scripts/deep_audit.py --check --baseline /tmp/main_deep_audit.json
          else
            echo "::notice::baseline deep-audit absente sur origin/main — comparaison sautée"
          fi
      - name: Visibilité R1 — exécutés vs découverts
        if: always()
        run: |
          disc=$(python -c "import unittest; print(unittest.defaultTestLoader.discover('tests').countTestCases())")
          base=$(cat .github/test-count-baseline.txt)
          echo "::notice::suite complète = $disc tests ; gate --fast baseline = $base ; écart = SLOW_FILES"

  # ═══ PALIER T1 — frontend (≤ 6 min) ═══
  t1-frontend:
    # `ci` est consulté comme pour t1-core et t1-security : une PR qui modifie
    # CE job (version de Node, commande, cache) touche `.github/**`, donc
    # `frontend=false` — sans ce `|| ci`, le palier sortait `skipped` et la
    # modification du gate frontend n'était jamais validée par le gate
    # frontend. C'était le dernier palier à ne pas consulter `ci`
    # (t1-core : #277 ; t1-security : #281 ; ici le 10/10).
    if: >-
      github.event_name != 'schedule' &&
      (needs.changes.outputs.frontend == 'true' ||
       needs.changes.outputs.ci == 'true')
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dépendances
        run: npm ci --no-audit --no-fund
      - name: Typecheck (tsc --noEmit) — BLOQUANT
        run: npm run typecheck
      - name: Tests (vitest)
        run: npm test

  # ═══ PALIER T1 — sécurité rapide (secrets + CVE + rochets) ═══
  # E2 (audit 10/10) : pip-audit et le rochet bandit COMPLET vivaient en T2,
  # donc jamais exécutés (cf. T1-core : la merge queue n'est pas activée).
  # Une CVE dans les dépendances ne doit pas attendre un palier qui ne tourne
  # pas. bandit complet = 519 avis au 10/10, ~1 min : il a sa place ici.
  t1-security:
    if: >-
      github.event_name != 'schedule' &&
      (github.event_name == 'merge_group' || needs.changes.outputs.core == 'true'
       || needs.changes.outputs.ci == 'true')
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Dépendances
        run: pip install --no-deps -r requirements.lock --quiet
      - name: Bandit ciblé (bind/shell/eval, 0 attendu — BLOQUANT)
        run: |
          pip install bandit --quiet
          # Garde fail-CLOSED : sans elle, un bandit absent/cassé rend un grep
          # vide, donc « 0 finding », donc un gate VERT qui n'a rien mesuré.
          python -c "import bandit" 2>/dev/null || { echo "::error::bandit indisponible — le gate ne peut pas mesurer"; exit 1; }
          for t in B104 B602 B603 B605 B607; do
            if python -m bandit -q -ll -r backend discord_bot scripts -t "$t" | grep -q "^>> Issue:"; then
              echo "::error::bandit $t détecté (bind large / shell / eval)"
              exit 1
            fi
          done
          echo "bandit ciblé : 0 finding"
      - name: Gitleaks — secrets (BLOQUANT)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks detect --source . --redact --no-banner --config .gitleaks.toml --exit-code 1
      - name: Rochet except-pass (BLOQUANT)
        run: python scripts/audit_except_pass.py --check
      - name: Rochet dette_PR <= dette_main (except-pass)
        run: |
          # Même garde fail-CLOSED que le rochet deep-audit : une REF
          # non résolvable = ROUGE, un chemin absent sur main = introduction.
          if ! git rev-parse --verify --quiet origin/main >/dev/null; then
            echo "::error::origin/main introuvable — le rochet dette_PR <= dette_main ne peut pas comparer (checkout avec fetch-depth: 0 ?)"
            exit 1
          fi
          if git show origin/main:.github/except-pass-baseline.json > /tmp/main_except_pass.json 2>/dev/null; then
            python scripts/audit_except_pass.py --check --baseline /tmp/main_except_pass.json
          else
            echo "::notice::baseline absent sur origin/main — comparaison sautée"
          fi
      - name: Pip-audit — CVE (BLOQUANT)
        run: |
          pip install pip-audit --quiet
          python -m pip_audit --no-deps --disable-pip -r requirements.lock
      # Les deux rochets bandit (stock + dette PR vs main) sont fusionnés : le
      # scan ne tourne qu'UNE fois, les deux verdicts sont rendus dessus.
      - name: Bandit complet — rochets stock + dette PR vs main
        run: |
          pip install bandit --quiet
          # Garde fail-CLOSED (E2-ter, 10/10). Avant : si bandit était absent ou
          # cassé, `total` valait 0, et `0 > 519` est faux → la marche PASSAIT en
          # annonçant « bandit complet : 0 (référence 519) ». Un outil absent
          # rendait un gate VERT sur 519 avis non mesurés — la même famille que
          # les autres fail-open du dépôt. Reproduit en local le 10/10.
          python -c "import bandit" 2>/dev/null || { echo "::error::bandit indisponible — le gate ne peut pas mesurer"; exit 1; }
          total=$(python -m bandit -q -ll -r backend discord_bot scripts 2>/dev/null | grep -c "^>> Issue:" || true)
          # Un scan qui rend 0 alors que la référence n'est pas 0 est SUSPECT :
          # soit l'outil n'a pas tourné, soit il a été neutralisé. On refuse.
          if [ "$total" -eq 0 ]; then
            ref0=$(cat .github/bandit-baseline.txt)
            if [ "$ref0" -ne 0 ]; then
              echo "::error::scan bandit vide (0 avis) alors que la référence est $ref0 — le scan n'a PAS mesuré"
              exit 1
            fi
          fi
          ref=$(cat .github/bandit-baseline.txt)
          echo "bandit complet : $total (référence $ref)"
          if [ "$total" -gt "$ref" ]; then
            echo "::error::le stock d'avis bandit a AUGMENTÉ ($total > $ref)"
            exit 1
          fi
          # Même garde fail-CLOSED que les deux autres rochets de dette : une
          # REF non résolvable = ROUGE (le rochet ne peut pas comparer), un
          # chemin absent sur main = introduction.
          if ! git rev-parse --verify --quiet origin/main >/dev/null; then
            echo "::error::origin/main introuvable — le rochet dette_PR <= dette_main ne peut pas comparer (checkout avec fetch-depth: 0 ?)"
            exit 1
          fi
          if ref_main=$(git show origin/main:.github/bandit-baseline.txt 2>/dev/null); then
            if [ "$total" -gt "$ref_main" ]; then
              echo "::error::la dette bandit de la PR ($total) dépasse celle de main ($ref_main)"
              exit 1
            fi
          else
            echo "::notice::baseline bandit absent sur origin/main — comparaison sautée"
          fi

  # ═══ PALIER T2 — merge queue (avant main, ≤ 20 min) ═══
  # La suite COMPLÈTE (SLOW_FILES inclus) + le frontend complet : c'est l'état
  # fusionné réel qui est jugé. Les oracles et rochets (audit_check, deep-audit,
  # pip-audit, bandit) sont désormais en T1 : ils doivent tourner sur CHAQUE PR,
  # pas seulement ici — la merge queue n'est pas activée sur ce dépôt, donc ce
  # palier ne se déclenche qu'en workflow_dispatch. Ce qui reste ici est ce qui
  # est réellement trop lent pour T1.
  t2-full:
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install --no-deps -r requirements.lock --quiet
      - name: Suite COMPLÈTE (SLOW_FILES inclus) — BLOQUANT
        run: python scripts/run_tests.py

  # ═══ PALIER T3 — nuit (schedule, libre) ═══
  # Le lent doit tourner, pas être ignoré (R1, issue #235 constat 2 :
  # test_onchain_admin_auth 684 fns jamais exécutées). + gitleaks sur
  # l'historique complet + calibration pleine du gate.
  t3-night:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install --no-deps -r requirements.lock --quiet
      - name: Suite COMPLÈTE (SLOW_FILES inclus) — BLOQUANT
        run: python scripts/run_tests.py
      - name: Gitleaks — historique complet
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks detect --source . --redact --no-banner --config .gitleaks.toml --exit-code 1
      - name: Exécutés vs découverts
        if: always()
        run: |
          disc=$(python -c "import unittest; print(unittest.defaultTestLoader.discover('tests').countTestCases())")
          echo "::notice::T3 exécutée ; $disc tests découverts au total"

  # ═══ GATE AGRÉGÉ — le SEUL required status check ═══
  # docs/41 + branche protégée. Le gate dépend des paliers pertinents selon
  # l'ÉVÉNEMENT (pas selon les chemins — sinon une PR docs-only aurait un
  # gate vide et skipped, qui bloquerait). Il rend TOUJOURS success/failure,
  # jamais skipped.
  #
  # Astuce : `needs` liste tous les paliers ; les paliers skippés (mauvais
  # événement/chemin) n'empêchent PAS le gate de tourner grâce à
  # `if: always() && !cancelled() && !contains(needs.*.result, 'failure')`.
  # Le gate échoue si UN palier pertinent échoue, passe sinon.
  gate:
    if: always() && !cancelled()
    needs: [changes, t1-core, t1-frontend, t1-security, t2-full, t3-night]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Agréger le verdict des paliers
        run: |
          # Sur un schedule, seuls T3 tourne ; sinon T1 (+T2 en merge_group).
          # Un palier 'skipped' (filtre chemins/événement) est neutre ; seuls
          # 'failure'/'cancelled' font échouer le gate. 'success' ou 'skipped'
          # partout = gate VERT.
          failed=""
          for r in "${{ needs.t1-core.result }}" "${{ needs.t1-frontend.result }}" \
                   "${{ needs.t1-security.result }}" "${{ needs.t2-full.result }}" \
                   "${{ needs.t3-night.result }}"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              failed="$failed $r"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::un palier a échoué ($failed) — merge bloqué"
            exit 1
          fi
          echo "::notice::gate VERT — paliers pertinents OK (skipped = filtré, neutre)"
          echo "Seul check requis par le branch protection : ce job 'gate'."
